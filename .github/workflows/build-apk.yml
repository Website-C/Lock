name: Build debug APK on: workflow_dispatch: jobs: build: runs-on: ubuntu-latest steps: - uses: actions/checkout@v4 - name: Set up JDK 17 uses: actions/setup-java@v4 with: distribution: temurin java-version: '17' - name: Set up Gradle uses: gradle/actions/setup-gradle@v4 with: gradle-version: '8.7' - name: Build debug APK working-directory: HonestLock run: gradle assembleDebug - name: Upload APK uses: actions/upload-artifact@v4 with: name: honest-lock-debug-apk path: HonestLock/app/build/outputs/apk/debug/app-debug.apk
